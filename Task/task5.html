<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            font-size: 30px;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        #h2 {
            text-align: center;
            margin-top: 200px;
        }

        .outer {
            width: 1200px;
            margin: auto;
            padding: 50px;
            /* background-color: rgb(147, 217, 147); */
        }

        .head {
            height: 100px;
            background-color: rgb(6, 244, 6);
            border: 2px solid;
        }

        .main {
            display: flex;
            gap: 10px;
            justify-content: center;

        }

        .sideleft {
            margin-top: 10px;
            width: 20%;
            height: 400px;
            background-color: rgb(6, 244, 6);
            border: 2px solid;

        }

        .sideright {
            margin-top: 10px;
            width: 80%;
            height: 400px;
        }

        .content1 {
            width: 100%;
            height: 50%;
            background-color: rgb(6, 244, 6);
            border: 2px solid;

        }

        .content2 {
            width: 100%;
            height: 46%;
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;

        }

        .cont1 {
            height: 100%;
            width: 50%;
            background-color: rgb(6, 244, 6);
            border: 2px solid;
        }

        .cont2 {
            height: 100%;
            width: 50%;
            background-color: rgb(6, 244, 6);
            border: 2px solid;
        }

        .footer {
            height: 100px;
            margin-top: 10px;
            background-color: rgb(6, 244, 6);
            border: 2px solid;
        }

        #text {
            margin-top: 100px;
        }

        #text1 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="outer">
        <h1> CSS GRID
        </h1>
        <div class="head">
            <h1 id="text1">Hearder</h1>
        </div>
        <div class="main">
            <div class="sideleft">
                <h1 id="h2">Side Bar</h1>
            </div>
            <div class="sideright">
                <div class="content1">
                    <h1 id="text">Content1</h1>
                </div>
                <div class="content2">
                    <div class="cont1">
                        <h1 id="text">Content2</h1>
                    </div>
                    <div class="cont2">
                        <h1 id="text">Content3</h1>
                    </div>
                </div>
            </div>

        </div>
        <div class="footer">
            <h1 id="text1">Footer</h1>
        </div>

    </div>
</body>

</html>
