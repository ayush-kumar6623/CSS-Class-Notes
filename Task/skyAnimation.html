<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Animation || sun rise sky</title>
</head>
<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #eef2f3;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(to bottom,
                #f7f7f5 0%,
                #eaf0f2 55%,
                #cddbe0 100%);
    }

    /* SUN */
    .sun {
        position: absolute;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #e5bd2f;
        top: 14%;
        right: 12%;
        box-shadow: 0 0 30px rgba(229, 189, 47, 0.25);
        animation: sunFloat 5s ease-in-out infinite alternate;
    }

    @keyframes sunFloat {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-10px);
        }
    }

    /* MOUNTAINS */
    .mountains {
        position: absolute;
        bottom: 16%;
    }

</style>
<body>

    <div class="scene">
        <div class="sun"></div>
        <div class="mountains">
            <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
                <path fill="#cddbe0" fill-opacity="1"
                    d="M0,224L48,202.7C96,181,192,139,288,138.7C384,139,480,181,576,197.3C672,213,768,203,864,176C960,149,1056,107,1152,90.7C1248,75,1344,85,1392,90.7L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,
                    48,
                    320L0,
                    320Z">
                </path>
            </svg>
        </div>
    </div>



</body>
</html>
