<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

#chatBtn {
    position: fixed;
    right: 30px;
    bottom: 480px;

    width: 110px;
    height: 110px;

    border: none;
    border-radius: 30%;

    background-color: #ff9800;
    color: white;

    font-size: 50px;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* ================= WHATSAPP ================= */

#whatsApp {
    background-color: rgb(41, 239, 51);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 30px;
    right: 30px;
}

/* ================= MAIL ================= */

#mail {
    background-color: rgb(122, 122, 229);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 180px;
    right: 30px;
}

/* ================= CALL ================= */

#call {
    background-color: rgb(18, 18, 120);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 330px;
    right: 30px;
}


/* ================= CHAT BOX ================= */

#chatBox {
    position: fixed;

    right: 160px;
    bottom: 30px;

    width: 350px;
    height: 500px;

    background-color: white;

    border-radius: 15px;

    box-shadow: 0 5px 30px rgba(0,0,0,0.3);

    overflow: hidden;

    display: none;
}


/* ================= CHAT HEADER ================= */

.chat-header {
    height: 65px;

    background-color: #ff9800;

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    font-size: 20px;
    font-weight: bold;
}

#closeChat {
    border: none;

    background: transparent;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


/* ================= CHAT BODY ================= */

#chatMessages {
    height: 365px;

    padding: 15px;

    overflow-y: auto;

    background-color: #f5f5f5;
}


/* ================= MESSAGE ================= */

.message {
    max-width: 80%;

    padding: 10px 14px;

    margin-bottom: 10px;

    border-radius: 10px;

    font-size: 15px;
}


/* Bot Message */

.bot {
    background-color: white;

    float: left;

    clear: both;

    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}


/* User Message */

.user {
    background-color: #ff9800;

    color: white;

    float: right;

    clear: both;
}


/* ================= INPUT AREA ================= */

.chat-input {
    height: 70px;

    display: flex;

    align-items: center;

    padding: 10px;

    background-color: white;
}

#userInput {
    flex: 1;

    height: 45px;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 0 15px;

    outline: none;

    font-size: 15px;
}

#sendBtn {
    width: 45px;
    height: 45px;

    margin-left: 8px;

    border: none;

    border-radius: 50%;

    background-color: #ff9800;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

</style>

</html>
