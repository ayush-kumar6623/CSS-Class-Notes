<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

#chatBtn {
    position: fixed;
    right: 30px;
    bottom: 480px;

    width: 110px;
    height: 110px;

    border: none;
    border-radius: 30%;

    background-color: #ff9800;
    color: white;

    font-size: 50px;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

#whatsApp {
    background-color: rgb(41, 239, 51);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 30px;
    right: 30px;
}

#mail {
    background-color: rgb(122, 122, 229);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 180px;
    right: 30px;
}

#call {
    background-color: rgb(18, 18, 120);
    border-radius: 30%;
    color: white;
    font-size: 50px;
    position: fixed;
    border: none;
    padding: 30px;
    bottom: 330px;
    right: 30px;
}



#chatBox {
    position: fixed;
    right: 200px;
    bottom: 60px;
    width: 350px;
    height: 500px;
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.3);
    /* overflow: hidden;
    display: none; */
}

.chat-header {
    height: 65px;
    background-color: red;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 20px;
    font-weight: bold;
}

#closeChat {
    border: none;
    background: transparent;
    color: white;
    font-size: 25px;
    cursor: pointer;
}



#chatMessages {
    height: 365px;
    padding: 15px;
    overflow-y: auto;
    background-color: #f5f5f5;
}

.message {
    max-width: 80%;
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    font-size: 15px;

    
}



.chat-input {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 10px;
    background-color: white;
}

#userInput {
    flex: 1;
    height: 45px;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 0 15px;
    outline: none;

    font-size: 15px;
}

#sendBtn {
    width: 45px;
    height: 45px;
    margin-left: 8px;
    border: none;
    border-radius: 50%;
    background-color: #ff9800;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

</style>

</head>
<body>
    <button id="chatBtn">
        <i class="fa-solid fa-comment"></i>
    </button>
    <!-- CHAT BOX=-->
    <div id="chatBox">
        <!-- Header -->
        <div class="chat-header">
            <span>
                <i class="fa-solid fa-robot"></i>
                Ai Chat Bot
            </span>
            <button id="closeChat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="chatMessages">
            <div class="message bot">
                Hello 👋 <br>
                How can I help you?
            </div>
        </div>

        <div class="chat-input">
            <input
                type="text"
                id="userInput"
                placeholder="Type a message..."
            >
            <button id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <a id="whatsApp" href="#">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <a id="mail" href="#">
        <i class="fa-solid fa-envelope"></i>
    </a>
    <a id="call" href="#">
        <i class="fa-solid fa-phone"></i>
    </a>


<script>


let chatBtn = document.getElementById("chatBtn");
let chatBox = document.getElementById("chatBox");
let closeChat = document.getElementById("closeChat");
let sendBtn = document.getElementById("sendBtn");
let userInput = document.getElementById("userInput");
let chatMessages = document.getElementById("chatMessages");

chatBtn.addEventListener("click", function () {
    chatBox.style.display = "block";
});

closeChat.addEventListener("click", function () {
    chatBox.style.display = "none";
});

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script> 

</body>
</html>
